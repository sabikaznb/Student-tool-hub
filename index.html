    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #222629;
            --text-color: #ffffff;
            --screen-bg: #9ead86;
            --screen-text: #111111;
            --btn-bg: #3a3f44;
            --btn-sci: #1b4965;
            --accent: #72efdd;
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --screen-bg: #e2e8f0;
            --screen-text: #0f172a;
            --btn-bg: #cbd5e1;
            --btn-sci: #93c5fd;
            --accent: #0f766e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            transition: all 0.3s ease;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }
        .theme-toggle {
            background: var(--btn-sci);
            color: var(--text-color);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }
        @media (min-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr 1fr;
            }
        }
        .calculator, .graphing-panel, .quiz-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.15);
            border: 2px solid var(--btn-bg);
            box-sizing: border-box;
        }
        h1, h2 {
            margin-top: 0;
            font-size: 20px;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        .ti-screen {
            background: var(--screen-bg);
            color: var(--screen-text);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        #calc-expression {
            width: 100%;
            background: transparent;
            border: none;
            font-size: 16px;
            text-align: right;
            outline: none;
            color: inherit;
        }
        #calc-result {
            font-size: 22px;
            font-weight: bold;
            text-align: right;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        button.calc-btn {
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background: var(--btn-bg);
            color: var(--text-color);
            border-radius: 6px;
            transition: transform 0.1s, opacity 0.1s;
        }
        button.calc-btn:active {
            transform: scale(0.95);
        }
        .btn-sci { background: var(--btn-sci) !important; }
        .btn-eval { background: #52b788 !important; color: black !important; grid-column: span 2; }
        .btn-clear { background: #e63946 !important; color: white !important; }
        
        /* Canvas & Controls */
        canvas {
            background: #ffffff;
            border-radius: 6px;
            width: 100%;
            height: 250px;
            display: block;

            display: flex;
            gap: 8px;

        }

            flex: 1;
            padding: 8px;
            font-size: 12px;
            cursor: pointer;
            background: var(--btn-bg);
            color: var(--text-color);
            border: none;
            border-radius: 4px;
        }
        #history-list {
            margin-top: 10px;
            font-size: 12px;
            max-height: 60px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 4px;
            list-style: none;
            padding-left: 0;
        }
        #history-list li {
            padding: 3px;
            border-bottom: 1px solid rgba(255,255,255,0.1);

<body data-theme="dark">

<header class="app-header">
    <h1>MathPilot Tools</h1>
    <button class="theme-toggle" onclick="toggleTheme()">☀️ Theme</button>
</header>

<main class="main-layout">
    <!-- Calculator Panel -->
    <section class="calculator">
        <h2>Advanced Scientific Engine</h2>
        <div class="ti-screen">
            <input type="text" id="calc-expression" readonly placeholder="0">
            <div id="calc-result">0</div>
        </div>
        
        <div class="buttons">
            <button class="calc-btn btn-clear" onclick="clearCalc()">C</button>
            <button class="calc-btn btn-sci" onclick="input('sin(')">sin</button>
            <button class="calc-btn btn-sci" onclick="input('cos(')">cos</button>
            <button class="calc-btn btn-sci" onclick="backspace()">⌫</button>
            
            <button class="calc-btn btn-sci" onclick="input('tan(')">tan</button>
            <button class="calc-btn btn-sci" onclick="input('log(')">log</button>
            <button class="calc-btn btn-sci" onclick="input('π')">π</button>
            <button class="calc-btn" onclick="input('/')">/</button>
            
            <button class="calc-btn" onclick="input('7')">7</button>
            <button class="calc-btn" onclick="input('8')">8</button>
            <button class="calc-btn" onclick="input('9')">9</button>
            <button class="calc-btn" onclick="input('*')">*</button>
            
            <button class="calc-btn" onclick="input('4')">4</button>
            <button class="calc-btn" onclick="input('5')">5</button>
            <button class="calc-btn" onclick="input('6')">6</button>
            <button class="calc-btn" onclick="input('-')">-</button>
            
            <button class="calc-btn" onclick="input('1')">1</button>
            <button class="calc-btn" onclick="input('2')">2</button>
            <button class="calc-btn" onclick="input('3')">3</button>
            <button class="calc-btn" onclick="input('+')">+</button>
            
            <button class="calc-btn" onclick="input('0')">0</button>
            <button class="calc-btn" onclick="input('.')">.</button>
            <button class="calc-btn btn-eval" onclick="calculate()">=</button>
        </div>
        <ul id="history-list"></ul>
    </section>

    <!-- Graphing Panel -->
    <section class="graphing-panel">
        <h2>Interactive Function Plotter</h2>
        <div style="margin-bottom: 10px;">
            <label for="eq-select" style="font-size: 13px;">Select Function: </label>
            <select id="eq-select" onchange="drawGraph()" style="padding: 4px; border-radius: 4px;">
                <option value="x*x">y = x² (Quadratic)</option>
                <option value="Math.sin(x)">y = sin(x) (Trig)</option>
                <option value="2*x + 1">y = 2x + 1 (Linear)</option>
            </select>
        </div>
        <canvas id="graphCanvas"></canvas>
        <div class="graph-controls">
            <button onclick="zoom(0.8)">Zoom In</button>
            <button onclick="zoom(1.2)">Zoom Out</button>
            <button onclick="resetGraph()">Reset View</button>
        </div>
    </section>
</main>
