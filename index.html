<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="keywords" content="handheld calculator online, scientific graphing calculator, math simulator, test prep tool">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* Exact Handheld Casing Design from Screenshot */
        .calculator-container {
            background: #000000;
            width: 100%;
            max-width: 385px;
            padding: 15px 12px;
            border-radius: 20px;
            border: 3px solid #32373d;
            box-shadow: 0px 25px 50px rgba(0,0,0,0.9);
            box-sizing: border-box;
        }

        /* Screen Wrapper with Blue/Red Outline */
        .screen-bezel {
            background: #1a1e24;
            padding: 6px;
            border-radius: 6px;
            border: 2px solid #0056b3;
            margin-bottom: 12px;
        }

        /* White LCD Emulator Screen */
        .lcd-window {
            background: #ffffff;
            color: #000000;
            font-family: 'Courier New', Courier, monospace;
            padding: 8px;
            min-height: 160px;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0px 3px 8px rgba(0,0,0,0.2);
            font-size: 13px;
            font-weight: bold;
            line-height: 1.2;
        }

        .status-header {
            font-size: 8px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 2px;
            margin-bottom: 6px;
            color: #333;
            display: flex;
            justify-content: space-between;
            letter-spacing: 0.3px;
        }

        .screen-text {
            text-align: left;
        }
        .window-header {
            color: #0056b3;
            font-size: 13px;
            margin-top: 4px;
        }

        /* 5-Column Button Grid Layout */
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        /* Top Row Function Row keys */
        .f-switches {
            background: #2d3138;
            color: #ffffff;
            font-size: 10px;
            padding: 6px 0;
            border: 1px solid #1c1f24;
            border-bottom: 3px solid #000;
            border-radius: 4px;
            text-transform: lowercase;
            cursor: pointer;
        }

        /* Printed Sub-Labels on Plastic Frame Configuration */
        .key-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .top-print-label {
            font-size: 8px;
            font-weight: bold;
            height: 11px;
            margin-bottom: 1px;
            width: 100%;
            text-align: center;
            white-space: nowrap;
        }
        .lbl-blue { color: #3182ce; }
        .lbl-green { color: #38a169; }
        .lbl-gray { color: #a0aec0; }

        /* General Buttons Specs */
        button.hardware-btn {
            width: 100%;
            padding: 9px 0;
            font-size: 11px;
            font-weight: bold;
            border-radius: 5px;
            border: 1px solid #000;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.05s;
        }
        button.hardware-btn:active {
            transform: scale(0.92);
        }

        /* Perfect Button Color Customizations matching image */
        .btn-black { background: #1c1f24; color: #fff; border-bottom: 2px solid #000; }
        .btn-blue { background: #1a365d; color: #fff; border-bottom: 2px solid #000; }
        .btn-green { background: #22543d; color: #fff; border-bottom: 2px solid #000; }
        .btn-white { background: #ffffff; color: #000; font-size: 15px; padding: 7px 0; border-bottom: 2px solid #cbd5e1; }
        .btn-darkgray { background: #2d3748; color: #fff; font-size: 13px; border-bottom: 2px solid #1a202c; }

        /* Circular Arrow D-Pad Zone Spanning 2 Rows & 2 Columns */
        .dpad-zone {
            grid-column: span 2;
            grid-row: span 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circular-dpad {
            width: 72px;
            height: 72px;
            background: #23272e;
            border-radius: 50%;
            border: 2px solid #000;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            box-shadow: inset 0px 3px 6px rgba(0,0,0,0.6);
        }
        .arrow-dir {
            background: transparent;
            border: none;
            color: #3182ce;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <!-- Blue Border Top LCD Screen Bezel Frame -->
    <div class="screen-bezel">
        <div class="lcd-window">
            <div class="status-header">
                <span>NORMAL FLOAT AUTO REAL RADIAN MP</span>
                <span>🔋</span>
            </div>
            <div class="screen-text" id="screen-terminal">
                <div>WINDOW</div>
                <div class="window-header">Xmin=-10</div>
                <div>Xmax=10</div>
                <div>Xscl=1</div>
                <div>Ymin=-10</div>
                <div>Ymax=10</div>
                <div>Yscl=1</div>
                <div>Xres=1</div>
            </div>
        </div>
    </div>

    <!-- Complete Handheld Interface Keypad Layout Matrix -->
    <div class="keypad-grid">
        <!-- Row 1: Graphing Layout System Switches -->
        <button class="f-switches" onclick="btnAction('y=')">y=</button>
        <button class="f-switches" onclick="btnAction('window')">window</button>
        <button class="f-switches" onclick="btnAction('zoom')">zoom</button>
        <button class="f-switches" onclick="btnAction('trace')">trace</button>
        <button class="f-switches" onclick="btnAction('graph')">graph</button>

        <!-- Row 2 & 3 Left Blocks Sharing Matrix with D-Pad Array -->
        <!-- Row 2 Left -->
        <div class="key-wrapper">
            <span class="top-print-label lbl-blue">quit</span>
            <button class="hardware-btn btn-blue" onclick="btnAction('2nd')">2nd</button>
        </div>
        <div class="key-wrapper">
            <span class="top-print-label lbl-gray">ins</span>
            <button class="hardware-btn btn-black" onclick="btnAction('mode')">mode</button>
        </div>
        <div class="key-wrapper">
            <span class="top-print-label"></span>
            <button class="hardware-btn btn-black" onclick="btnAction('del')">del</button>
        </div>
        
        <!-- Circular D-PAD Integration -->
        <div class="dpad-zone">
            <div class="circular-dpad">
                <div></div><button class="arrow-dir" onclick="btnAction('▲')">▲</button><div></div>
                <button class="arrow-dir" onclick="btnAction('◀')">◀</button><div></div><button class="arrow-dir" onclick="btnAction('▶')">▶</button>
                <div></div><button class="arrow-dir" onclick="btnAction('▼')">▼</button><div></div>
            </div>
        </div>

        <!-- Row 3 Left -->
        <div class="key-wrapper">
            <span class="top-print-label lbl-green">A-lock</span>
            <button class="hardware-btn btn-green" onclick="btnAction('alpha')">alpha</button>
        </div>
        <div class="key-wrapper">
            <span class="top-print-label lbl-blue">link</span>
            <button class="hardware-btn btn-black" onclick="btnAction('X')">X,T,θ,n</button>
        </div>
        <div class="key-wrapper">
            <span class="top-print-label lbl-blue">list</span>
            <button class="hardware-btn btn-black" onclick="btnAction('stat')">stat</button>
        </div>

        <!-- Row 4 -->
        <div class="key-wrapper"><span class="top-print-label lbl-blue">test A</span><button class="hardware-btn btn-black" onclick="btnAction('math')">math</button></div>
        <div class="key-wrapper"><span class="top-print-label lbl-blue">angle B</span><button class="hardware-btn btn-black" onclick="btnAction('apps')">apps</button></div>
        <div class="key-wrapper"><span class="top-print-label lbl-blue">draw C</span><button class="hardware-btn btn-black" onclick="btnAction('prgm')">prgm</button></div>
