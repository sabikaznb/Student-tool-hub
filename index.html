<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Optimization Meta Tags -->
    <title>MathPilot Pro CE | Online Graphing & Advanced Scientific Calculator</title>
    <meta name="description" content="Free online premium student calculator layout inspired by advanced graphing tools. Execute matrix calculus, algebra, and plot equations instantly.">
    <meta name="keywords" content="handheld calculator online, scientific graphing calculator, math simulator, test prep tool">
    <meta name="robots" content="index, follow">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calc-case {
            background: #000000;
            width: 100%;
            max-width: 385px;
            padding: 15px 12px;
            border-radius: 24px;
            border: 4px solid #32373d;
            box-shadow: 0px 25px 50px rgba(0,0,0,0.9);
            box-sizing: border-box;
        }
        /* Top Screen Frame */
        .screen-bezel {
            background: #1a1e24;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #0056b3;
            margin-bottom: 12px;
        }
        .lcd-display {
            background: #ffffff;
            color: #000000;
            font-family: 'Courier New', Courier, monospace;
            padding: 6px;
            min-height: 140px;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .screen-status {
            font-size: 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            color: #333;
            border-bottom: 1px solid #ccc;
            padding-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .screen-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-align: right;
            padding-top: 5px;
        }
        #input-line {
            font-size: 14px;
            color: #000;
            min-height: 18px;
            letter-spacing: 0.5px;
        }
        #output-line {
            font-size: 22px;
            font-weight: bold;
            color: #000;
            margin-top: 4px;
        }

        /* Keyboard Grid Structure */
        .keypad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        /* Top Function Keys */
        .f-key {
            background: #2d3138;
            color: #ffffff;
            font-size: 10px;
            padding: 6px 0;
            border-radius: 4px;
            border: 1px solid #1c1f24;
            border-bottom: 3px solid #111;
            text-transform: lowercase;
        }

        /* Key Layout Elements */
        .key-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }
        .sec-label {
            font-size: 8px;
            font-weight: bold;
            height: 10px;
            margin-bottom: 2px;
            width: 100%;
            text-align: center;
            white-space: nowrap;
        }
        .sec-left { color: #4299e1; } /* 2nd Labels */
        .sec-right { color: #48bb78; } /* Alpha Labels */

        button.calc-btn {
            width: 100%;
            padding: 10px 0;
            font-size: 12px;
            font-weight: bold;
            border-radius: 5px;
            border: 1px solid #111;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.05s;
        }
        button.calc-btn:active {
            transform: scale(0.92);
        }

        /* Exact Button Color Categorization */
        .k-dark { background: #1c1f24; color: #fff; }
        .k-blue { background: #1a365d; color: #fff; }
        .k-green { background: #22543d; color: #fff; }
        .k-white { background: #ffffff; color: #000; font-size: 15px; padding: 8px 0; }
        .k-op { background: #2d3748; color: #fff; font-size: 15px; }
        .k-enter { background: #4a5568; color: #fff; }

        /* Custom Cross Direction D-Pad Structure */
        .dpad-container {
            grid-column: span 2;
            grid-row: span 2;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .dpad-circle {
            width: 68px;
            height: 68px;
            background: #2d3138;
            border-radius: 50%;
            border: 2px solid #111;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }
        .d-arrow {
            background: transparent;
            border: none;
            color: #72efdd;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="calc-case">
    <!-- Blue Border Top LCD Screen -->
    <div class="screen-bezel">
        <div class="lcd-display">
            <div class="screen-status">
                <span>NORMAL FLOAT AUTO REAL RADIAN MP</span>
                <span>🔋</span>
            </div>
            <div class="screen-body">
                <div id="input-line"></div>
                <div id="output-line">0</div>
            </div>
        </div>
    </div>

    <!-- Complete 10-Row Keypad Grid System -->
    <div class="keypad">
        <!-- Row 1: Graphing Function row -->
        <button class="f-key" onclick="alert('Y= Mode')">y=</button>
        <button class="f-key" onclick="alert('Window Settings')">window</button>
        <button class="f-key" onclick="alert('Zoom Factor')">zoom</button>
        <button class="f-key" onclick="alert('Trace Plot')">trace</button>
        <button class="f-key" onclick="alert('Graph View')">graph</button>

        <!-- Row 2 & 3 Left Keys + D-PAD Alignment -->
        <!-- Row 2 Left -->
        <div class="key-container">
            <span class="sec-label sec-left">quit</span>
            <button class="calc-btn k-blue" onclick="alert('2nd Layer Active')">2nd</button>
        </div>
        <div class="key-container">
            <span class="sec-label sec-left">ins</span>
            <button class="calc-btn k-dark" onclick="alert('Mode Menu')">mode</button>
        </div>
        <div class="key-container">
            <span class="sec-label"></span>
            <button class="calc-btn k-dark" onclick="backspace()">del</button>
        </div>
        
        <!-- D-PAD Area Spanning 2 Rows / 2 Columns -->
        <div class="dpad-container">
            <div class="dpad-circle">
                <div></div><button class="d-arrow" onclick="alert('Up')">▲</button><div></div>
                <button class="d-arrow" onclick="alert('Left')">◀</button><div></div><button class="d-arrow" onclick="alert('Right')">▶</button>
                <div></div><button class="d-arrow" onclick="alert('Down')">▼</button><div></div>
            </div>
        </div>

        <!-- Row 3 Left -->
        <div class="key-container">
            <span class="sec-label sec-left">A-lock</span>
            <button class="calc-btn k-green" onclick="alert('Alpha Lock Active')">alpha</button>
        </div>
        <div class="key-container">
            <span class="sec-label sec-left">link</span>
            <button class="calc-btn k-dark" onclick="press('X')">X,T,θ,n</button>
        </div>
        <div class="key-container">
            <span class="sec-label sec-left">list</span>
            <button class="calc-btn k-dark" onclick="alert('Stat Menu')">stat</button>
        </div>

        <!-- Row 4 -->
        <div class="key-container"><span class="sec-label sec-left">test A</span><button class="calc-btn k-dark" onclick="alert('Math Options')">math</button></div>
        <div class="key-container"><span class="sec-label sec-left">angle B</span><button class="calc-btn k-dark" onclick="alert('Apps')">apps</button></div>
        <div class="key-container"><span class="sec-label sec-left">draw C</span><button class="calc-btn k-dark" onclick="alert('Prgm')">prgm</button></div>
        <div class="key-container"><span class="sec-label sec-left">distr</span><button class="calc-btn k-dark" onclick="alert('Vars')">vars</button></div>
        <div class="key-container"><span class="sec-label"></span><button class="calc-btn k-dark" onclick="clearAll()">clear</button></div>

        <!-- Row 5 -->
        <div class="key-container"><span class="sec-label sec-left">matrix D</span><button class="calc-btn k-dark" onclick="press('**(-1)')">x⁻¹</button></div>
        <div class="key-container"><span class="sec-label sec-left">sin⁻¹ E</span><button class="calc-btn k-dark" onclick="press('sin(')">sin</button></div>
        <div class="key-container"><span class="sec-label sec-left">cos⁻¹ F</span><button class="calc-btn k-dark" onclick="press('cos(')">cos</button></div>
        <div class="key-container"><span class="sec-label sec-left">tan⁻¹ G</span><button class="calc-btn k-dark" onclick="press('tan(')">tan</button></div>
        <div class="key-container"><span class="sec-label sec-left">π H</span><button class="calc-btn k-dark" onclick="press('^')">^</button></div>

        <!-- Row 6 -->
