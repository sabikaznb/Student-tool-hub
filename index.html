<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>MathPilot Tools | Advanced Online Scientific Calculator</title>
    <meta name="description" content="Use our free advanced online scientific calculator for complex mathematics, engineering, algebra, and trigonometry calculations.">
    <meta name="keywords" content="scientific calculator online, advanced scientific calculator, free math solver">
    <meta name="robots" content="index, follow">

    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .calculator {
            background: #222629;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
            border: 3px solid #3a3f44;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 16px;
            margin-top: 0;
            color: #72efdd;
            letter-spacing: 2px;
        }
        .ti-screen {
            background: #9ead86;
            color: #111;
            padding: 12px;
            border-radius: 6px;
            border: 3px inset #556044;
            margin-bottom: 15px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }
        #calc-expression {
            width: 100%;
            background: transparent;
            border: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            text-align: right;
            outline: none;
            color: #333;
        }
        #calc-result {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            text-align: right;
            color: #000;
        }
        /* 5-Column Grid for Professional Scientific Look */
        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        button {
            padding: 12px 5px;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border: 1px solid #111;
            background: #2d3238;
            color: #fff;
            border-radius: 6px;
            transition: 0.1s;
        }
        button:active {
            transform: scale(0.95);
            background: #444;
        }
        .btn-sci {
            background: #1b4965;
            color: #72efdd;
        }
        .btn-op {
            background: #3a3f44;
            color: #fff;
        }
        .btn-clear {
            background: #e63946;
            color: white;
        }
        .btn-del {
            background: #4a4e69;
        }
        .btn-eval {
            background: #52b788;
            color: black;
            grid-column: span 2;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <main class="calculator">
        <h1>MATHPILOT ADVANCED CE</h1>
        
        <div class="ti-screen">
            <input type="text" id="calc-expression" readonly placeholder="0">
            <div id="calc-result">0</div>
        </div>
        
        <!-- Professional 5-Column Scientific Pad Layout -->
        <div class="buttons">
            <!-- Row 1 -->
            <button class="btn-clear" onclick="clearAll()">C</button>
            <button class="btn-del" onclick="backspace()">DEL</button>
            <button class="btn-sci" onclick="input('(')">(</button>
            <button class="btn-sci" onclick="input(')')">)</button>
            <button class="btn-op" onclick="input('/')">÷</button>
            
            <!-- Row 2 -->
            <button class="btn-sci" onclick="input('sin(')">sin</button>
            <button class="btn-sci" onclick="input('cos(')">cos</button>
            <button class="btn-sci" onclick="input('tan(')">tan</button>
            <button class="btn-sci" onclick="input('^')">xʸ</button>
            <button class="btn-op" onclick="input('*')">×</button>
            
            <!-- Row 3 -->
            <button class="btn-sci" onclick="input('log(')">log</button>
            <button class="btn-sci" onclick="input('ln(')">ln</button>
            <button class="btn-sci" onclick="input('√(')">√</button>
            <button class="btn-sci" onclick="input('π')">π</button>
            <button class="btn-op" onclick="input('-')">-</button>
            
            <!-- Row 4 (Numbers & Plus) -->
            <button onclick="input('7')">7</button>
            <button onclick="input('8')">8</button>
            <button onclick="input('9')">9</button>
            <button class="btn-sci" onclick="input('e')">e</button>
            <button class="btn-op" onclick="input('+')">+</button>
            
            <!-- Row 5 -->
            <button onclick="input('4')">4</button>
            <button onclick="input('5')">5</button>
            <button onclick="input('6')">6</button>
            <button onclick="input('1')">1</button>
            <button onclick="input('2')">2</button>
            
            <!-- Row 6 -->
            <button onclick="input('3')">3</button>
            <button onclick="input('0')">0</button>
            <button onclick="input('.')">.</button>
            <button class="btn-eval" onclick="runExecution()">=</button>
        </div>
    </main>
</div>

<script>
    const exprView = document.getElementById('calc-expression');
    const resView = document.getElementById('calc-result');

    function input(char) {
        exprView.value += char;
    }

    function clearAll() {
        exprView.value = '';
        resView.innerText = '0';
    }

    function backspace() {
        exprView.value = exprView.value.slice(0, -1);
    }

    function runExecution() {
        let inputString = exprView.value;
        if (!inputString) return;

        try {
            let cleanExpr = inputString
                .replace(/÷/g, '/')
                .replace(/×/g, '*')
                .replace(/π/g, 'Math.PI')
                .replace(/e/g, 'Math.E')
                .replace(/sin\(/g, 'Math.sin(')
                .replace(/cos\(/g, 'Math.cos(')
                .replace(/tan\(/g, 'Math.tan(')
                .replace(/log\(/g, 'Math.log10(')
                .replace(/ln\(/g, 'Math.log(')
                .replace(/√\(/g, 'Math.sqrt(')
                .replace(/\^/g, '**');

            let finalValue = Function('"use strict"; return (' + cleanExpr + ')')();

            if (finalValue === Infinity || finalValue === -Infinity || isNaN(finalValue)) {
                resView.innerText = "Math Error";
                return;
            }

            resView.innerText = Number(finalValue.toFixed(8));

        } catch (err) {
            resView.innerText = "Syntax Error";
        }
    }
</script>
</body>
</html>
