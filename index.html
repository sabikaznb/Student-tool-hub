<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            min-height: 100vh;
        }
        .calc-body {
            background-color: #1a1a1a;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.05);
            border: 2px solid #333;
        }
        /* TI-84 Screen Style */
        .screen {
            background-color: #93a893;
            color: #000;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            border-radius: 8px;
            border: 4px solid #111;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }
        .screen-header {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
            border-bottom: 1px dashed #556b55;
            padding-bottom: 3px;
            margin-bottom: 5px;
            color: #222;
        }
        .display-expr {
            min-height: 20px;
            font-size: 14px;
            word-break: break-all;
            text-align: left;
            color: #222;
        }
        .display-res {
            min-height: 26px;
            font-size: 20px;
            font-weight: bold;
            text-align: right;
            word-break: break-all;
            color: #000;
        }
        /* Keyboard Grid */
        .keypad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px 2px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px #111;
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .btn:active {
            box-shadow: 0 1px #111;
            transform: translateY(2px);
        }
        .sub-text {
            font-size: 8px;
            color: #26a69a;
            margin-bottom: 2px;
            line-height: 1;
        }
        /* Custom Key Colors matching TI-84 */
        .btn-green { background-color: #2e7d32; color: #fff; }
        .btn-blue { background-color: #1565c0; color: #fff; }
        .btn-red { background-color: #c62828; color: #fff; }
        .btn-num { background-color: #424242; font-size: 14px; }
        .btn-op { background-color: #263238; color: #ffb74d; font-size: 13px; }
        
        .span-2 { grid-column: span 2; }
    </style>
</head>
<body>

<main class="calc-body">
    <!-- TI-84 Display Screen -->
    <header class="screen">
        <div class="screen-header">NORMAL FLOAT AUTO REAL RADIAN MP</div>
        <div id="expression" class="display-expr"></div>
        <div id="result" class="display-res">0</div>
    </header>

    <!-- TI-84 Keypad Layout -->
    <section class="keypad">
        <!-- Row 1 -->
        <button class="btn btn-blue" onclick="appendOp('y=')"><span class="sub-text">statplot</span>y=</button>
        <button class="btn btn-red" onclick="appendOp('window')"><span class="sub-text">tblset</span>window</button>
        <button class="btn" onclick="appendOp('zoom')"><span class="sub-text">format</span>zoom</button>
        <button class="btn" onclick="appendOp('trace')"><span class="sub-text">calc</span>trace</button>
        <button class="btn" onclick="appendOp('graph')"><span class="sub-text">table</span>graph</button>

        <!-- Row 2 -->
        <button class="btn btn-green" onclick="toggle2nd()"><span class="sub-text">2nd</span>2nd</button>
        <button class="btn" onclick="clearDisplay()"><span class="sub-text">quit</span>mode</button>
        <button class="btn" onclick="deleteChar()"><span class="sub-text">ins</span>del</button>
        <button class="btn btn-op span-2" onclick="appendOp('^')"><span class="sub-text">power</span>^</button>

        <!-- Row 3 -->
        <button class="btn" onclick="appendOp('x')"><span class="sub-text">link</span>X,T,θ,n</button>
        <button class="btn" onclick="appendOp('stat')"><span class="sub-text">list</span>stat</button>
        <button class="btn" onclick="appendOp('math')"><span class="sub-text">test</span>math</button>
        <button class="btn" onclick="appendOp('apps')"><span class="sub-text">angle</span>apps</button>
        <button class="btn" onclick="appendOp('prgm')"><span class="sub-text">draw</span>prgm</button>

        <!-- Row 4 -->
        <button class="btn" onclick="appendOp('sin(')"><span class="sub-text">sin⁻¹</span>sin</button>
        <button class="btn" onclick="appendOp('cos(')"><span class="sub-text">cos⁻¹</span>cos</button>
        <button class="btn" onclick="appendOp('tan(')"><span class="sub-text">tan⁻¹</span>tan</button>
        <button class="btn" onclick="appendOp('π')"><span class="sub-text">H</span>π</button>
        <button class="btn btn-red" onclick="clearDisplay()"><span class="sub-text">clear</span>clear</button>

        <!-- Row 5 -->
        <button class="btn" onclick="appendOp('^2')"><span class="sub-text">√</span>x²</button>
        <button class="btn" onclick="appendOp('(')"><span class="sub-text">{</span>(</button>
        <button class="btn" onclick="appendOp(')')"><span class="sub-text">}</span>)</button>
        <button class="btn btn-op" onclick="appendOp('/')"><span class="sub-text">e</span>÷</button>
        <button class="btn btn-op" onclick="appendOp('*')"><span class="sub-text">[</span>×</button>

        <!-- Row 6 -->
        <button class="btn" onclick="appendOp('log(')"><span class="sub-text">10ˣ</span>log</button>
        <button class="btn btn-num" onclick="appendOp('7')"><span class="sub-text">u</span>7</button>
        <button class="btn btn-num" onclick="appendOp('8')"><span class="sub-text">v</span>8</button>
        <button class="btn btn-num" onclick="appendOp('9')"><span class="sub-text">w</span>9</button>
        <button class="btn btn-op" onclick="appendOp('-')"><span class="sub-text">]</span>-</button>

        <!-- Row 7 -->
        <button class="btn" onclick="appendOp('ln(')"><span class="sub-text">eˣ</span>ln</button>
        <button class="btn btn-num" onclick="appendOp('4')"><span class="sub-text">L4</span>4</button>
        <button class="btn btn-num" onclick="appendOp('5')"><span class="sub-text">L5</span>5</button>
        <button class="btn btn-num" onclick="appendOp('6')"><span class="sub-text">L6</span>6</button>
        <button class="btn btn-op" onclick="appendOp('+')"><span class="sub-text">W</span>+</button>

        <!-- Row 8 -->
        <button class="btn" onclick="appendOp('sto')"><span class="sub-text">rcl</span>sto→</button>
        <button class="btn btn-num" onclick="appendOp('1')"><span class="sub-text">L1</span>1</button>
        <button class="btn btn-num" onclick="appendOp('2')"><span class="sub-text">L2</span>2</button>
        <button class="btn btn-num" onclick="appendOp('3')"><span class="sub-text">L3</span>3</button>
        <button class="btn btn-blue span-2" style="grid-row: span 2; height: 100%;" onclick="calculate()"><span class="sub-text">entry</span>ENTER</button>

        <!-- Row 9 -->
        <button class="btn" onclick="appendOp('0')"><span class="sub-text">off</span>0</button>
        <button class="btn btn-num" onclick="appendOp('.')"><span class="sub-text">i</span>.</button>
        <button class="btn btn-num" onclick="appendOp('(-)')"><span class="sub-text">ans</span>(-)</button>
    </section>
</main>

<script>
    let exprElement = document.getElementById('expression');
    let resElement = document.getElementById('result');
    let currentExpr = "";

    function appendOp(val) {
        if (val === '(-)') val = '-';
        currentExpr += val;
        exprElement.innerText = currentExpr;
    }

    function clearDisplay() {
        currentExpr = "";
        exprElement.innerText = "";
        resElement.innerText = "0";
    }

    function deleteChar() {
        currentExpr = currentExpr.slice(0, -1);
        exprElement.innerText = currentExpr;
    }

    function calculate() {
        if (!currentExpr) return;
        try {
            let parsedExpr = currentExpr
                .replace(/π/g, 'Math.PI')
                .replace(/sin\(/g, 'Math.sin(')
                .replace(/cos\(/g, 'Math.cos(')
                .replace(/tan\(/g, 'Math.tan(')
                .replace(/log\(/g, 'Math.log10(')
                .replace(/ln\(/g, 'Math.log(')
                .replace(/\^/g, '**');

            let evalResult = eval(parsedExpr);
            
            // Format output for TI-84 accuracy
            if (typeof evalResult === 'number') {
                evalResult = parseFloat(evalResult.toFixed(8));
            }
            
            resElement.innerText = evalResult;
        } catch (e) {
            resElement.innerText = "ERR:SYNTAX";
        }
    }

    function toggle2nd() {
        alert("2nd Mode Active: Additional functions selected.");
    }
</script>

</body>
</html>
