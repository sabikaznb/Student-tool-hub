<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags for Google Ranking -->
    <title>TI-84 Online Scientific Calculator & Student Tool Hub</title>
    <meta name="description" content="Free online TI-84 style scientific calculator, math solver, and student practice quiz hub. Calculate algebra, trigonometry, and test your skills easily.">
    <meta name="keywords" content="TI-84 calculator online, scientific calculator, student tool hub, math solver, online calculator for students">
    <meta name="robots" content="index, follow">

    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .container {
            width: 100%;
            max-width: 380px;
        }
        /* TI-84 Calculator Body Style */
        .calculator {
            background: #222629;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
            border: 3px solid #3a3f44;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            font-size: 18px;
            margin-top: 0;
            color: #72efdd;
            letter-spacing: 1px;
        }
        /* TI-84 LCD Screen Style */
        .ti-screen {
            background: #9ead86;
            color: #111;
            padding: 12px;
            border-radius: 6px;
            border: 3px inset #556044;
            margin-bottom: 15px;
            min-height: 60px;
        }
        #calc-expression {
            width: 100%;
            background: transparent;
            border: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            text-align: right;
            outline: none;
            color: #111;
        }
        #calc-result {
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            text-align: right;
            margin-top: 5px;
            color: #000;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        button {
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #111;
            background: #3a3f44;
            color: #fff;
            border-radius: 4px;
            transition: 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-sci {
            background: #1b4965;
        }
        .btn-eval {
            background: #52b788;
            color: black;
            grid-column: span 2;
        }
        .btn-clear {
            background: #e63946;
            color: white;
        }
        #history-list {
            margin-top: 10px;
            padding-left: 10px;
            font-size: 12px;
            max-height: 80px;
            overflow-y: auto;
            background: #15181a;
            padding: 8px;
            border-radius: 4px;
            list-style: none;
            color: #aaa;
        }
        #history-list li {
            padding: 2px 0;
            border-bottom: 1px solid #222;
            cursor: pointer;
        }

        /* Practice Questions Section */
        .questions-section {
            background: #222629;
            padding: 20px;
            border-radius: 14px;
            border: 3px solid #3a3f44;
            box-sizing: border-box;
        }
        .question-card {
            margin-bottom: 15px;
            background: #15181a;
            padding: 12px;
            border-radius: 6px;
        }
        .question-card p {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #e2e8f0;
        }
        .options label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            cursor: pointer;
            color: #cbd5e1;
        }
        .submit-quiz {
            width: 100%;
            background: #52b788;
            color: black;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        #quiz-score {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: #72efdd;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- TI-84 Style Calculator -->
    <div class="calculator">
        <h2>TI-84 PLUS CE</h2>
        
        <div class="ti-screen">
            <input type="text" id="calc-expression" placeholder="0">
            <div id="calc-result">= 0</div>
        </div>
        
        <div class="buttons">
            <button class="btn-clear" data-act="clear">C</button>
            <button data-act="delete">DEL</button>
            <button class="btn-sci" data-act="append" data-val="(">(</button>
            <button class="btn-sci" data-act="append" data-val=")">)</button>
            
            <button class="btn-sci" data-act="append" data-val="Math.sin(">sin</button>
            <button class="btn-sci" data-act="append" data-val="Math.cos(">cos</button>
            <button class="btn-sci" data-act="append" data-val="Math.tan(">tan</button>
            <button data-act="append" data-val="/">÷</button>
            
            <button data-act="append" data-val="7">7</button>
            <button data-act="append" data-val="8">8</button>
            <button data-act="append" data-val="9">9</button>
            <button data-act="append" data-val="*">×</button>
            
            <button data-act="append" data-val="4">4</button>
            <button data-act="append" data-val="5">5</button>
            <button data-act="append" data-val="6">6</button>
            <button data-act="append" data-val="-">-</button>
            
            <button data-act="append" data-val="1">1</button>
            <button data-act="append" data-val="2">2</button>
            <button data-act="append" data-val="3">3</button>
            <button data-act="append" data-val="+">+</button>
            
            <button data-act="append" data-val="0">0</button>
            <button data-act="append" data-val=".">.</button>
            <button data-act="eval" class="btn-eval">=</button>
        </div>
        
        <ul id="history-list"></ul>
    </div>

    <!-- Practice Questions Section -->
    <div class="questions-section">
        <h2>Math Practice Quiz</h2>
        
        <div class="question-card">
            <p>1. What is the value of sin(90°)?</p>
            <div class="options">
                <label><input type="radio" name="q1" value="0"> 0</label>
                <label><input type="radio" name="q1" value="1"> 1</label>
                <label><input type="radio" name="q1" value="-1"> -1</label>
            </div>
        </div>

        <div class="question-card">
            <p>2. What is 15 × 4 + 10?</p>
            <div class="options">
                <label><input type="radio" name="q2" value="60"> 60</label>
                <label><input type="radio" name="q2" value="70"> 70</label>
                <label><input type="radio" name="q2" value="50"> 50</label>
            </div>
        </div>

        <button class="submit-quiz" onclick="checkAnswers()">Submit Answers</button>
        <div id="quiz-score"></div>
    </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const exprInput = document.getElementById('calc-expression');
    const resultDisplay = document.getElementById('calc-result');
    const historyList = document.getElementById('history-list');

    let currentExpression = '';

    function evaluateCurrent() {
      if (!currentExpression.trim()) {
        if (resultDisplay) resultDisplay.textContent = '= 0';
        return;
      }
      try {
        let sanitized = currentExpression
          .replace(/sin\(/g, 'Math.sin(Math.PI/180*')
          .replace(/cos\(/g, 'Math.cos(Math.PI/180*')
          .replace(/tan\(/g, 'Math.tan(Math.PI/180*');
          
        const result = Function('"use strict";return (' + sanitized + ')')();
        
        if (resultDisplay) {
          resultDisplay.textContent = '= ' + Number(result.toFixed(6));
        }
        saveHistory(currentExpression, Number(result.toFixed(6)));
      } catch (error) {
        if (resultDisplay) {
          resultDisplay.textContent = 'Error';
        }
      }
    }

    function appendCharacter(value) {
      currentExpression += String(value);
      if (exprInput) exprInput.value = currentExpression;
    }

    function clearAll() {
      currentExpression = '';
      if (exprInput) exprInput.value = '';
      if (resultDisplay) resultDisplay.textContent = '= 0';
    }

    function deleteLast() {
      currentExpression = currentExpression.slice(0, -1);
      if (exprInput) exprInput.value = currentExpression;
    }

    function saveHistory(expression, result) {
      if (!historyList) return;
      const item = document.createElement('li');
      item.textContent = expression + ' = ' + result;
      
      item.addEventListener('click', function () {
        currentExpression = expression;
        if (exprInput) exprInput.value = expression;
        if (resultDisplay) resultDisplay.textContent = '= ' + result;
      });

      historyList.prepend(item);
      while (historyList.children.length > 10) {
        historyList.removeChild(historyList.lastElementChild);
      }
    }

    document.querySelectorAll('button[data-act]').forEach(function (button) {
      button.addEventListener('click', function () {
        const action = button.dataset.act;
        const value = button.dataset.val;

        if (action === 'append') appendCharacter(value);
        if (action === 'eval') evaluateCurrent();
        if (action === 'clear') clearAll();
        if (action === 'delete') deleteLast();
      });
    });
  });

  function checkAnswers() {
    let score = 0;
    const q1 = document.querySelector('input[name="q1"]:checked');
    const q2 = document.querySelector('input[name="q2"]:checked');

    if (q1 && q1.value === '1') score++;
    if (q2 && q2.value === '70') score++

    document.getElementById('quiz-score').textContent = 'Your Score: ' + score + ' / 2';
  }
</script>

</body>
    </html>
