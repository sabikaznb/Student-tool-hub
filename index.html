<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Tool Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .calculator {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            width: 300px;
        }
        #calc-expression {
            width: 100%;
            height: 40px;
            font-size: 18px;
            margin-bottom: 10px;
            text-align: right;
            padding: 5px;
            box-sizing: border-box;
        }
        #calc-result {
            font-size: 22px;
            font-weight: bold;
            text-align: right;
            margin-bottom: 15px;
            color: #333;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background: #e0e0e0;
            border-radius: 5px;
        }
        button:hover {
            background: #d5d5d5;
        }
        .btn-equal {
            background: #4CAF50;
            color: white;
            grid-column: span 2;
        }
        .btn-equal:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Student Calculator</h2>
    <input type="text" id="calc-expression" placeholder="0">
    <div id="calc-result">= 0</div>
    
    <div class="buttons">
        <button data-act="clear">C</button>
        <button data-act="delete">DEL</button>
        <button data-act="append" data-val="/">/</button>
        <button data-act="append" data-val="*">*</button>
        
        <button data-act="append" data-val="7">7</button>
        <button data-act="append" data-val="8">8</button>
        <button data-act="append" data-val="9">9</button>
        <button data-act="append" data-val="-">-</button>
        
        <button data-act="append" data-val="4">4</button>
        <button data-act="append" data-val="5">5</button>
        <button data-act="append" data-val="6">6</button>
        <button data-act="append" data-val="+">+</button>
        
        <button data-act="append" data-val="1">1</button>
        <button data-act="append" data-val="2">2</button>
        <button data-act="append" data-val="3">3</button>
        <button data-act="eval" class="btn-equal">=</button>
        
        <button data-act="append" data-val="0" style="grid-column: span 2;">0</button>
        <button data-act="append" data-val=".">.</button>
    </div>
    
    <ul id="history-list" style="margin-top: 15px; padding-left: 20px; font-size: 14px; max-height: 100px; overflow-y: auto;"></ul>
</div>

<script>
  // Simple Math Engine fallback if missing
  window.MathEngine = window.MathEngine || {
    evaluate: function(expr) {
      try {
        return Function('"use strict";return (' + expr + ')')();
      } catch (e) {
        throw new Error('Invalid expression');
      }
    }
  };

  document.addEventListener('DOMContentLoaded', function () {
    const exprInput = document.getElementById('calc-expression');
    const resultDisplay = document.getElementById('calc-result');
    const historyList = document.getElementById('history-list');

    let currentExpression = '';

    function evaluateCurrent() {
      if (!currentExpression.trim()) {
        if (resultDisplay) resultDisplay.textContent = '= 0';
        return;
      }
      try {
        const result = window.MathEngine.evaluate(currentExpression);
        if (resultDisplay) {
          resultDisplay.textContent = '= ' + result;
        }
        saveHistory(currentExpression, result);
      } catch (error) {
        if (resultDisplay) {
          resultDisplay.textContent = 'Error';
        }
      }
    }

    function appendCharacter(value) {
      currentExpression += String(value);
      if (exprInput) exprInput.value = currentExpression;
    }

    function clearAll() {
      currentExpression = '';
      if (exprInput) exprInput.value = '';
      if (resultDisplay) resultDisplay.textContent = '= 0';
    }

    function deleteLast() {
      currentExpression = currentExpression.slice(0, -1);
      if (exprInput) exprInput.value = currentExpression;
    }

    function saveHistory(expression, result) {
      if (!historyList) return;
      const item = document.createElement('li');
      item.textContent = expression + ' = ' + result;
      historyList.prepend(item);
    }

    document.querySelectorAll('button[data-act]').forEach(function (button) {
      button.addEventListener('click', function () {
        const action = button.dataset.act;
        const value = button.dataset.val;

        if (action === 'append') appendCharacter(value);
        if (action === 'eval') evaluateCurrent();
        if (action === 'clear') clearAll();
        if (action === 'delete') deleteLast();
      });
    });
  });
</script>

</body>
</html>
